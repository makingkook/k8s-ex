# 모든 노드에 1개씩 뜨는 로그 수집 예시
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "tail -F /var/log/containers/*.log"]
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
