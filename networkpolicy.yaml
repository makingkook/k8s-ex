# db Pod는 web Pod에서 오는 5432 트래픽만 허용
# EKS에서는 vpc-cni의 enableNetworkPolicy가 켜져 있어야 적용됩니다(cluster.yaml에 설정됨).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-web
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - port: 5432
